name: Implementation Task
description: Feature or implementation task corresponding to CHECKLIST.md
title: "[Task]: <Lane-ID> <Short description>"
labels: ["ready-for-agent", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### Checklist Implementation Task
        Reference task specifications in `docs/04-build-plan.md` and track progress in `CHECKLIST.md`.

  - type: input
    id: task_id
    attributes:
      label: Task ID
      description: Stable checklist identifier from CHECKLIST.md (e.g. P1-A-01, P3-B-02).
      placeholder: P0-A-01
    validations:
      required: true

  - type: dropdown
    id: lane
    attributes:
      label: Engineering Lane
      description: The designated lane owning this task per OWNERSHIP.md.
      options:
        - "Lane A: Platform & Core (Lead: Hari)"
        - "Lane B: Classroom & Collaboration (Lead: Rahul)"
        - "Lane C: AI & Autonomous Learning (Lead: Praj)"
        - "Lane D: Core Experience & UI (Lead: Vamshi)"
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope & Target Paths
      description: List target files and exclusive lane directories.
      placeholder: |
        Target files:
        - src/server/core/...
        - tests/unit/lane-a/...
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria & Checkpoint Command
      description: Verification command and expected assertions/behavior.
      placeholder: |
        Checkpoint command:
        npm run test:contracts
    validations:
      required: true
