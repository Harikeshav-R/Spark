name: Bug Report
description: Report a bug, crash, or unexpected behavior
title: "[Bug]: <Short description>"
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide clear reproduction steps, environment details, and relevant log output.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the defect is.
    validations:
      required: true

  - type: dropdown
    id: lane
    attributes:
      label: Affected Subsystem / Lane
      options:
        - "Lane A (Platform & Core)"
        - "Lane B (Classroom & Collaboration)"
        - "Lane C (AI & Autonomous Learning)"
        - "Lane D (Core Experience & UI)"
        - "Toolchain & Infrastructure"
        - "Unknown / Cross-cutting"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Run 'npm run dev'
        2. Send POST request to '/api/classroom/lectures' with payload '...'
        3. See error response '...'
    validations:
      required: true

  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen versus what actually occurred?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs or Console Output
      description: Verbatim terminal or browser console logs.
      render: shell
